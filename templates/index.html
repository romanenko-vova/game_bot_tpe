<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-main: #070b1b;
            --bg-card: rgba(14, 23, 49, 0.78);
            --text-main: #e8eeff;
            --text-soft: #94a3d8;
            --neon-cyan: #2ae9ff;
            --neon-pink: #ff2cd1;
            --neon-lime: #89ff7c;
            --border: rgba(116, 151, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", "Arial", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at 20% 20%, rgba(42, 233, 255, 0.16), transparent 40%),
                radial-gradient(circle at 80% 0%, rgba(255, 44, 209, 0.14), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(137, 255, 124, 0.12), transparent 35%),
                var(--bg-main);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .app {
            width: min(560px, 100%);
            padding: 24px;
            border-radius: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 20px 50px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(42, 233, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 0 14px rgba(42, 233, 255, 0.5);
        }

        .subtitle {
            color: var(--text-soft);
            margin-bottom: 18px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .chip {
            flex: 1;
            min-width: 140px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(10, 18, 40, 0.8);
        }

        .chip b {
            color: var(--neon-cyan);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(116, 151, 255, 0.35);
            background: rgba(9, 16, 36, 0.88);
            color: var(--text-main);
            border-radius: 14px;
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .cell:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 18px rgba(42, 233, 255, 0.25);
        }

        .cell:disabled {
            cursor: default;
        }

        .cell.x {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(42, 233, 255, 0.7);
        }

        .cell.o {
            color: var(--neon-pink);
            text-shadow: 0 0 12px rgba(255, 44, 209, 0.7);
        }

        .cell.win {
            border-color: var(--neon-lime);
            box-shadow: 0 0 20px rgba(137, 255, 124, 0.35);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .status {
            color: var(--text-soft);
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 600;
            color: #041018;
            background: linear-gradient(120deg, var(--neon-cyan), #7cb9ff);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(42, 233, 255, 0.35);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(42, 233, 255, 0.48);
        }
    </style>
</head>
<body>
    <main class="app">
        <h1 class="title">Neon Tic-Tac-Toe</h1>
        <p class="subtitle">Футуристичный бой X и O. Кто первый соберет линию - тот и король арены.</p>

        <section class="hud">
            <div class="chip">Ходит: <b id="turn">X</b></div>
            <div class="chip">Счет X: <b id="score-x">0</b></div>
            <div class="chip">Счет O: <b id="score-o">0</b></div>
        </section>

        <section class="board" id="board" aria-label="Игровое поле 3 на 3">
            <button class="cell" data-index="0" aria-label="Клетка 1"></button>
            <button class="cell" data-index="1" aria-label="Клетка 2"></button>
            <button class="cell" data-index="2" aria-label="Клетка 3"></button>
            <button class="cell" data-index="3" aria-label="Клетка 4"></button>
            <button class="cell" data-index="4" aria-label="Клетка 5"></button>
            <button class="cell" data-index="5" aria-label="Клетка 6"></button>
            <button class="cell" data-index="6" aria-label="Клетка 7"></button>
            <button class="cell" data-index="7" aria-label="Клетка 8"></button>
            <button class="cell" data-index="8" aria-label="Клетка 9"></button>
        </section>

        <section class="footer">
            <p class="status" id="status">Нажимай на клетку и начинай раунд.</p>
            <button class="btn" id="reset">Новый раунд</button>
        </section>
    </main>

    <script>
        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const cells = Array.from(document.querySelectorAll(".cell"));
        const turnNode = document.getElementById("turn");
        const statusNode = document.getElementById("status");
        const scoreXNode = document.getElementById("score-x");
        const scoreONode = document.getElementById("score-o");
        const resetButton = document.getElementById("reset");

        let board = Array(9).fill("");
        let currentPlayer = "X";
        let gameOver = false;
        let scoreX = 0;
        let scoreO = 0;

        function checkWinner() {
            for (const line of winningLines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return line;
                }
            }
            return null;
        }

        function updateScoreView() {
            scoreXNode.textContent = String(scoreX);
            scoreONode.textContent = String(scoreO);
        }

        function endRound(message) {
            gameOver = true;
            statusNode.textContent = message;
            turnNode.textContent = "-";
            cells.forEach((cell) => {
                cell.disabled = true;
            });
        }

        function handleMove(event) {
            const cell = event.currentTarget;
            const index = Number(cell.dataset.index);

            if (board[index] || gameOver) {
                return;
            }

            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
            cell.disabled = true;

            const winnerLine = checkWinner();
            if (winnerLine) {
                // Подсвечиваем победную линию, чтобы сразу было видно кто забрал раунд.
                winnerLine.forEach((winIndex) => cells[winIndex].classList.add("win"));
                if (currentPlayer === "X") {
                    scoreX += 1;
                } else {
                    scoreO += 1;
                }
                updateScoreView();
                endRound("Раунд окончен: " + currentPlayer + " победил");
                return;
            }

            if (board.every(Boolean)) {
                endRound("Ничья. Перезапусти раунд и попробуй снова.");
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            turnNode.textContent = currentPlayer;
            statusNode.textContent = "Игра в процессе. Ходит " + currentPlayer;
        }

        function resetRound() {
            board = Array(9).fill("");
            currentPlayer = "X";
            gameOver = false;
            turnNode.textContent = currentPlayer;
            statusNode.textContent = "Новый раунд стартовал. Ходит X.";

            cells.forEach((cell) => {
                cell.textContent = "";
                cell.disabled = false;
                cell.classList.remove("x", "o", "win");
            });
        }

        cells.forEach((cell) => {
            cell.addEventListener("click", handleMove);
        });
        resetButton.addEventListener("click", resetRound);
    </script>
</body>
</html>
